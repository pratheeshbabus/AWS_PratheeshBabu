services:
  backend:
    build: ./backend
    image: aws-flask-backend:v1
    container_name: aws-flask-backend
    ports:
      - "5000:5000"
    networks:
      - aws-assignment-net

  frontend:
    build: ./frontend
    image: aws-express-frontend:v1
    container_name: aws-express-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - aws-assignment-net

networks:
  aws-assignment-net:
    driver: bridge
